apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-terra-metadata
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    juno-innovations.com/workload: "Server"
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "Qwen/Qwen3.8-27B — pre-configured FP8-vLLM server with 256K context"
  fields: |
    - name: icon
      description: "Icon shown for the workload"
      type: string
      required: false
      default: "https://raw.githubusercontent.com/aldmbmtl/Terra-Spark-Kit/main/plugins/qwen3-8-27b-spark/assets/logo.png"
    - name: served_model_name
      description: "Model name clients send in API requests (the OpenAI-compatible model field). Standardized across all kit workloads — each deployment has its own ingress."
      type: string
      required: false
      default: "model"
    - name: cpu
      description: "CPU cores for the vLLM worker (request = limit). Default 2 — heavy prefill may want 4"
      type: string
      required: false
      default: "2"
    - name: memory
      description: "Memory request = limit (Guaranteed QoS), footprint-derived (~50Gi: ~29GB fp8+overhead + ~15GB KV at 256K ctx + 2.4GB activation)."
      type: string
      required: false
      default: "56Gi"
    - name: gpu_memory_utilization
      description: "Fraction of device memory for weights + KV cache: ~47GB ceiling contains the ~32GB CUDA footprint (29GB fp8+overhead + ~15GB KV pool at 256K ctx)."
      type: string
      required: false
      default: "0.40"
    - name: hf_token
      description: "HuggingFace access token (used for private repos and future gating; optional for this ungated model)."
      type: string
      required: false
      sensitive: true
    - name: storage_class
      description: "StorageClass for the model cache volume (required)."
      type: k8sStorageClass
      required: true
    - name: storage_size
      description: "Model cache volume size in Gi."
      type: int
      required: false
      default: 100
