# Kuiper-injected standard values — do not remove
# Per-model defaults (2 CPU / 48Gi). At launch the metadata field default
# overrides Kuiper's injected standard value (verified platform behavior).
name: nemotron-coding-spark
icon: "https://raw.githubusercontent.com/aldmbmtl/Terra-Spark-Kit/main/plugins/nemotron-coding-spark/assets/logo.png"
served_model_name: "model"
user:
group:
cpu: "2"
memory: "48Gi"
cpuLimit: null
memoryLimit: null
idx: 0
guid: 0
puid: 0
host:
pullSecret:
session:
volumeMounts: []
volumes: []
env:
  - name: JUNO
    value: "true"
selector:
plugins: []
_kuiper:

# --- Nemotron 3.5 Lightning pre-configuration (locked) ---
image: "vllm/vllm-openai:v0.27.1"
model: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
draft_model: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark"
runtimeClassName: "nvidia"
max_model_len: 524288    # 512K context window for coding (4× original 131072)
max_num_seqs: 1          # 1 concurrent sequence (KV pool identical: 524288 × 1 = 131072 × 4)

# --- Exposed fields (match metadata.yaml) ---
gpu_memory_utilization: "0.40"
hf_token: ""
storage_class: ""
storage_size: 100
