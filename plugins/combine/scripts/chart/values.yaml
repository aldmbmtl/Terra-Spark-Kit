# Kuiper-injected standard values — do not remove
# No pod is rendered by this chart: it only fronts an already-running model workload.
name: combine
icon: "https://raw.githubusercontent.com/aldmbmtl/Terra-Spark-Kit/main/plugins/combine/assets/logo.png"
user:
group:
cpu: "1"
memory: "1Gi"
cpuLimit: null
memoryLimit: null
idx: 0
guid: 0
puid: 0
host:
pullSecret:
session:
volumeMounts: []
volumes: []
env:
  - name: JUNO
    value: "true"
selector:
plugins: []
_kuiper:

# --- Combine front-end for a running model workload (locked) ---
# The Service selector is driven by the `model` field below. The model must be
# launched as the specified plugin id in the same project, otherwise the selector
# matches nothing. This field is required — no default is provided.
model:

# --- Exposed fields (match metadata.yaml) ---
expose: "Ingress"
ingress_class: "nginx"
