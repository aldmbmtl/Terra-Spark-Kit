{{- if eq .Values.expose "Ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-ingress
spec:
  ingressClassName: {{ .Values.ingress_class | default "nginx" | quote }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /{{ .Release.Namespace }}/{{ .Values.name }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}
                port:
                  number: 8080
{{- end }}
