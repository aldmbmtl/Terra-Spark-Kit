apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-nginx-config
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }
    server {
      listen 8080;
      # Pass-through (no prefix strip): the Next.js app serves natively under
      # /plugin/<name> via baked basePath (next.config) + prefixed /api fetches.
      location /plugin/{{ .Values.name }} {
        proxy_pass http://127.0.0.1:{{ .Values.app_port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
      }
    }
