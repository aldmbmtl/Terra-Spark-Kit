apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-terra-metadata
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    juno-innovations.com/workload: "Server"
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "Text-to-knowledge-graph (NVIDIA txt2kg): Next.js UI + ArangoDB, LLM triple extraction via any kit vLLM model workload. CPU-only companion."
  fields: |
    - name: icon
      description: "Icon shown for the workload"
      type: string
      required: false
      default: "https://raw.githubusercontent.com/aldmbmtl/Terra-Spark-Kit/main/plugins/txt2kg-spark/assets/logo.png"
    - name: cpu
      description: "CPU cores for the app + ArangoDB (request = limit, Guaranteed QoS)."
      type: string
      required: false
      default: "2"
    - name: memory
      description: "Memory request = limit (Guaranteed QoS). 8Gi covers the Next.js runtime + ArangoDB; first boot's npm build peaks a bit higher within the limit."
      type: string
      required: false
      default: "8Gi"
    - name: llm_url
      description: "REQUIRED. OpenAI-compatible base URL of a launched kit model workload, e.g. http://<model-workload-name>:8080/plugin/<model-workload-name>/v1 (the model sidecar's rewrite strips /plugin/<name>; /v1 reaches vLLM — a bare `/v1` path (no `/plugin/<name>` prefix) 404s). Launch a model first — nemotron-super-49b-spark is the playbook's default pairing."
      type: string
      required: true
    - name: llm_model
      description: "The model string the app sends in API requests — must match the model workload's served_model_name (kit default: 'model')."
      type: string
      required: false
      default: "model"
    - name: publicAccess
      description: "Expose without Hubble auth. The app has no auth of its own and ArangoDB runs with ARANGO_NO_AUTH=1 — keep false (Hubble in front) unless you accept an open deployment."
      type: boolean
      required: false
      default: false
    - name: storage_class
      description: "StorageClass for the graph + app volume."
      type: k8sStorageClass
      required: true
    - name: storage_size
      description: "Volume size in Gi (ArangoDB data + app workspace)."
      type: int
      required: false
      default: 50
