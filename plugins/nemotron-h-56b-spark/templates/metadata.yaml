apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-terra-metadata
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    juno-innovations.com/workload: "Server"
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "Nemotron-H 56B Base (hybrid Mamba-2, dynamic FP8) — pre-configured plain-vLLM server"
  fields: |
    - name: icon
      description: "Icon shown for the workload"
      type: string
      required: false
      default: "https://raw.githubusercontent.com/aldmbmtl/Terra-Spark-Kit/main/plugins/nemotron-h-56b-spark/assets/logo.png"
    - name: served_model_name
      description: "Model name clients send in API requests (the OpenAI-compatible model field). Standardized across all kit workloads — each deployment has its own ingress."
      type: string
      required: false
      default: "model"
    - name: cpu
      description: "CPU cores for the vLLM worker (request = limit). Default 2 — heavy prefill may want 4"
      type: string
      required: false
      default: "2"
    - name: memory
      description: "Memory request = limit (Guaranteed QoS), footprint-derived (52.5Gi dynamic-FP8 weights + KV + activations + runtime). Lowering risks container OOM under load; raising reduces node headroom."
      type: string
      required: false
      default: "72Gi"
    - name: gpu_memory_utilization
      description: "Fraction of device memory for weights + KV cache: ~70GB ceiling contains the ~63GB CUDA footprint (52.5Gi FP8 weights + KV at 8K ctx); sits below the 72Gi cgroup limit."
      type: string
      required: false
      default: "0.55"
    - name: hf_token
      description: "HuggingFace access token (NVIDIA models require license acceptance; also used for private repos)."
      type: string
      required: false
      sensitive: true
    - name: storage_class
      description: "StorageClass for the model cache volume (required)."
      type: k8sStorageClass
      required: true
    - name: storage_size
      description: "Model cache volume size in Gi. Default 120 — the bf16 checkpoint is 104.9Gi on disk (FP8 quantization happens in-RAM at load, the cache stays bf16)."
      type: int
      required: false
      default: 120
