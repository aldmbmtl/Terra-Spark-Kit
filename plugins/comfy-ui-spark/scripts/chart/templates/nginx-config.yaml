apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-nginx-config
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }
    server {
      listen 8080;
      # absolute_redirect defaults ON: `return 301` would emit an ABSOLUTE
      # Location built from this server's own socket (http://host:8080/...) —
      # the browser follows it to the unfirewalled service port and times out.
      # Relative Location resolves against the caller's origin (https edge).
      absolute_redirect off;
      # Large image uploads through the node graph
      client_max_body_size 256m;
      # Prefix support is native since ComfyUI_frontend 1.33 (Dec 2025,
      # PR #7115, extended by #12833): the frontend derives its API base from
      # window.location.pathname and emits prefixed URLs itself, so the sidecar
      # only strips the prefix — no content rewriting (sub_filter), no source
      # patches, no query-string tricks. The mmartial image clones latest
      # ComfyUI at first boot, so the frontend always exceeds the 1.33 floor.
      # Exact-match 301: a bare /plugin/<name> (no trailing slash) would make
      # the frontend compute api_base = "/plugin" — wrong. $is_args$args
      # preserves any query string.
      location = /plugin/{{ .Values.name }} {
        return 301 /plugin/{{ .Values.name }}/$is_args$args;
      }
      location /plugin/{{ .Values.name }} {
        # Strip via $request_uri (RAW, encoded) — nginx `rewrite` operates on
        # the percent-DECODED URI and would turn %2F into a real slash, which
        # breaks POST /api/userdata/{file} saves (workflows/x.json → 405,
        # Comfy-Org/ComfyUI#9664). $comfy_path keeps %2F intact so the backend
        # sees a single segment and aiohttp decodes match_info itself. Query is
        # excluded from the capture ([^?]*) and re-appended via $is_args$args —
        # avoids the kaanlabs query-embedded-in-filename bug, so no ComfyUI
        # source patches are needed.
        if ($request_uri ~* "^/plugin/{{ .Values.name }}/([^?]*)") {
          set $comfy_path $1;
        }
        proxy_pass http://127.0.0.1:{{ .Values.app_port }}/$comfy_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (ComfyUI /ws protocol)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Progress streaming must not be buffered
        proxy_buffering off;
      }
    }
