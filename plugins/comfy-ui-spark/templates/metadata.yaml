apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-terra-metadata
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    juno-innovations.com/workload: "Server"
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "ComfyUI node-graph image generation (SDXL/Flux) on the DGX-native container. GPU-exclusive: run instead of, not alongside, a model workload. Models managed via the UI (Manager)."
  fields: |
    - name: icon
      description: "Icon shown for the workload"
      type: string
      required: false
      default: "https://raw.githubusercontent.com/aldmbmtl/Terra-Spark-Kit/main/plugins/comfy-ui-spark/assets/logo.png"
    - name: cpu
      description: "CPU cores for the ComfyUI worker (request only; limits come from cpuLimit/memoryLimit, empty = no limit)."
      type: string
      required: false
      default: "2"
    - name: memory
      description: "Memory request (48Gi fits SDXL/Flux-class checkpoints; raise for video-class). Limits come from cpuLimit/memoryLimit, empty = no limit."
      type: string
      required: false
      default: "48Gi"
    - name: publicAccess
      description: "Expose without Hubble auth. ComfyUI has no app-level auth, so keep false (Hubble in front) unless you accept an open generator."
      type: boolean
      required: false
      default: false
    - name: storage_class
      description: "StorageClass for the basedir volume (checkpoints, loras, vae, output, custom nodes + the runtime venv)."
      type: k8sStorageClass
      required: true
    - name: storage_size
      description: "Volume size in Gi."
      type: int
      required: false
      default: 100
